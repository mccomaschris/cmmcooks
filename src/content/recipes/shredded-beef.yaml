name: Shredded beef
categories:
  - dinner
ingredients:
  - name: 3 lbs chuck roast
  - name: Favorite rub/seasoning
  - name: 1 head of garlic roughly chopped
  - name: 1 white onion roughly chopped
  - name: 2-3 jalapeños roughly chopped
  - name: 18 oz beef broth/stock
instructions:
  - name: Heat smoker to 275°
  - name: Season chuck roast with favorite rub
  - name: Smoke chuck roast at 275° for 2 hours
  - name: In a slow cooker add chuck roast, broth, onions, garlic and jalapeños
  - name: Cook on high for 4-5 hours, flipping once
  - name: Remove beef and shred
