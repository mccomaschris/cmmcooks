name: Cabbage patch stew
categories:
  - dinner
ingredients:
  - name: 1 lb ground beef
  - name: 1 cup chopped onion
  - name: 2 ribs celery diced
  - name: 1 head of cabbage, roughly chopped
  - name: 28 oz canned stewed tomatoes
  - name: 15 oz pinto beans, drained and rinsed
  - name: 1/2 cup ketchup
  - name: 10 oz rotel, undrained
  - name: 2 tbsp ancho chili powder
  - name: 1/2 tsp oregano
instructions:
  - name: In a large skillet, cook the beef, onions and celery over medium heat
      until meat is no longer pink, breaking meat into crumbles; drain.
  - name: Transfer to a 5-qt. slow cooker. Stir in the cabbage, stewed tomatoes,
      beans, diced tomatoes, ketchup, chili powder, oregano, pepper and salt.
      Cover and cook on low for 6-8 hours or until cabbage is tender.
