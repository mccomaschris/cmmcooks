name: Cheesy shredded potatoes
categories:
  - sides
ingredients:
  - name: 32oz bag of frozen hash browns
  - name: 2 cans cream of chicken soup
  - name: 1 diced sweet onion
  - name: 16oz shredded Colby jack, or cheese of your choice
  - name: 8oz French onion dip
  - name: Your favorite BBQ rub
instructions:
  - name: Combine all ingredients in a baking dish
  - name: Bake at 375° for 60-75 minutes, stirring often
