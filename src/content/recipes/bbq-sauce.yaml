name: BBQ Sauce
categories:
  - sauces
ingredients:
  - name: 1 cup ketchup
  - name: 1/2 cup apple cider vinegar
  - name: 1/3 cup brown sugar
  - name: 1 tbsp worcestershire sauce
  - name: 1 tbsp BBQ rub
  - name: 1/4 cup beef broth
instructions:
  - name: Combine all ingredients in a sauce pan and simmer until desired thickness
