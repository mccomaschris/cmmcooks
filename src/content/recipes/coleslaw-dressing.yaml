name: Coleslaw dressing
categories:
  - sauces
ingredients:
  - name: 1/2 cup mayo
  - name: 1 bunch of green onions, diced
  - name: 2 tbsp apple cider vinegar
  - name: 2 tbsp sugar
  - name: 1 tsp celery seeds
  - name: 1 tsp black pepper
  - name: 1 tsp smoked paprika
  - name: Pinch of salt
instructions:
  - name: Add all items to large bowl and mix well
