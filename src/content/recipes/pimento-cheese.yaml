name: Pimento Cheese
categories:
  - sides
ingredients:
  - name: 12 oz diced pimentos
  - name: 4 ounces cream cheese, at room temperature
  - name: 1/2 cup Duke's
  - name: 2 tbsp dijon
  - name: 1 tsp hot sauce
  - name: 1/2 tsp salt
  - name: 1/4 tsp sugar
  - name: 1/8 tsp cayenne pepper
  - name: 1/8 tsp pepper
  - name: 1/2 tsp smoked paprika
  - name: 1/2 cup diced sweet relish
  - name: 1/4 cup bread and butter pickle juice
  - name: 16 oz sharp cheddar (or cheese of your choice)
instructions:
  - name: Mix cream cheese in a bowl until soft
  - name: Add Duke's and mix well
  - name: Add spices and hot sauce and mix
  - name: Add relish, pickle juice and cheese and mix
  - name: Add in pimentos and mix
