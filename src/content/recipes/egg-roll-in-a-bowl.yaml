name: Egg Roll in a Bowl
categories:
  - dinner
ingredients:
  - name: 1 lbs ground beef
  - name: 1 tbsp minced garlic
  - name: 1 tbsp ginger paste
  - name: 14 oz cole slaw mix
  - name: 2 tbsp sriracha
  - name: 1/3 cup soy sauce
  - name: 2 whole eggs
  - name: 1 tbsp sesame oil
  - name: 2 tbsp chives/green onions
instructions:
  - name: In large skillet brown ground beef
  - name: Add the garlic and cook until fragrant
  - name: Add the coleslaw, soy sauce, ginger and cook until desired doneness
  - name: Make a well in the center of the skillet and add the eggs. Scramble until
      done over low heat.
  - name: Top with sriracha, sesame seeds and sesame oil
