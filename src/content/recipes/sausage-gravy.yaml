name: Sausage gravy
categories:
  - sauces
ingredients:
  - name: 1 lbs breakfast sausage
  - name: 1/3 cup all-purpose flour
  - name: 3-4 cups milk
  - name: 4 tbsp black pepper
  - name: 1 tsp Lawry’s
  - name: 2 tbsp Cholula hot sauce
instructions:
  - name: Brown sausage over medium heat until cooked
  - name: Turn to medium low heat and sprinkle in flour, mixing constantly until
      flour is absorbed into meat
  - name: Slowly pour 3 cups of milk in, whisking constantly
  - name: Add pepper, Lawry’s and hot sauce, stir well
  - name: Cook gravy on medium low, stirring often, until gravy thickens (should
      take 10-15 minutes)
  - name: If gravy is too thick add a bit more milk
