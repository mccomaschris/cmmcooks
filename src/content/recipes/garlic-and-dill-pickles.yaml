name: Garlic and Dill Pickles
categories:
  - sides
ingredients:
  - name: Cucumbers
  - name: 3-5 whole garlic cloves
  - name: 1/4 Sweet onion sliced
  - name: Fresh dill
  - name: Fill white vinegar to half of 32oz jar, with dill, pickles and onions in
      jar
  - name: Fill remaining half with water
  - name: 4 tsp salt
  - name: 4 tsp sugar
instructions:
  - name: Boil vinegar, water, salt and sugar until salt and sugar disolves
  - name: Add boiled mixture over jarred cucumbers, garlic, onion and dill
