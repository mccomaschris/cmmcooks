name: Norma’s Pumpkin Pie
categories:
  - desserts
ingredients:
  - name: 2 9 inch pie crusts
  - name: 1 large can of pumpkin
  - name: 1 1/2 cup brown sugar
  - name: 4 eggs, well-beaten
  - name: 3 tbsp melted butter
  - name: 3 tsp pumpkin pie spice
  - name: 2 tbsp dark molasses
  - name: 1 tsp salt
  - name: 13 oz evaporated milk
instructions:
  - name: Line pie pans with pastry
  - name: Preheat oven to 450
  - name: Combine ingredients in order given
  - name: Bake at 450° for 10 minutes reduce heat quickly (leave oven door ajar) to
      slow oven to 325
  - name: Continue baking 30 minutes or so or until knife inserted in center comes
      out clean
  - name: Serve with Cool Whip
