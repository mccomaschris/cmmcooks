name: Horseradish sauce
categories:
  - sauces
ingredients:
  - name: 1/3 cup Duke’s mayo
  - name: 1/2 cup sour cream
  - name: 1/4 cup prepared horseradish
  - name: 2 tsp lemon juice
  - name: 1 tbsp The W Sauce
  - name: 2 tbsp chives
instructions:
  - name: Combine all ingredients in a bowl and mix well
