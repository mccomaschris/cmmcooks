name: Enchilada beef
categories:
  - dinner
ingredients:
  - name: 2 lbs shredded beef
  - name: 1 tbsp garlic powder
  - name: 1 tbsp smoked paprika
  - name: 10oz can red enchilada sauce
instructions:
  - name: In a pan heat up enchilada sauce, garlic powder and smoked paprika
  - name: Add shredded chuck roast to enchilada sauce
  - name: Cook over medium heat until most of the liquid disappears
